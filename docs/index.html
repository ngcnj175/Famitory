<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>FAMITORY マニュアル</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no">
    <meta name="description" content="FAMITORY（ファミトリー）のつかいかたマニュアル">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <style>
        :root {
            --theme-color: #3498db;
            --topbar-bg: #3498db;
            --topbar-fg: #ffffff;
            --topbar-h: 48px;
        }
        body, .sidebar, .markdown-section, .search input {
            font-family: 'BIZ UDPGothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ============ トップバー ============ */
        #topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--topbar-h);
            background: var(--topbar-bg);
            color: var(--topbar-fg);
            display: flex;
            align-items: center;
            padding: 0 8px;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        #topbar-toggle,
        #topbar-search-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            color: var(--topbar-fg);
        }
        #topbar-toggle:hover,
        #topbar-search-btn:hover { opacity: 0.8; }
        #topbar-title {
            font-weight: bold;
            font-size: 0.95em;
            line-height: 1.1;
            color: var(--topbar-fg);
            cursor: pointer;
            margin-left: 4px;
            white-space: pre-line;
        }
        #topbar-spacer { flex: 1; }
        #topbar-search {
            display: none;
            align-items: center;
            margin-right: 6px;
        }
        #topbar-search.open { display: flex; }
        #topbar-search input {
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 14px;
            width: 220px;
            outline: none;
            font-family: inherit;
            color: #333;
        }
        @media (max-width: 480px) {
            #topbar-search input { width: 150px; }
        }

        /* ============ サイドバー・本文のオフセット ============ */
        .sidebar {
            top: var(--topbar-h) !important;
            transition: left 250ms ease-out;
        }
        .content { top: var(--topbar-h) !important; }
        /* モバイル時は .content が position:static になるため padding で押し下げる */
        @media (max-width: 768px) {
            .content { padding-top: var(--topbar-h); }
        }

        /* Docsify既定のハンバーガー・サイト名は非表示（トップバーに統合） */
        .sidebar-toggle { display: none !important; }
        .sidebar .app-name { display: none !important; }
        /* サイドバー検索の入力欄だけ非表示にし、結果パネルも隠す（通常時） */
        .sidebar .search .input-wrap { display: none !important; }
        .sidebar .search { padding: 0 !important; margin: 0 !important; border: none !important; }
        .sidebar .search .results-panel { display: none !important; }
        /* トップバー検索が開いているとき、結果パネルをドロップダウンとして表示 */
        body.topbar-search-active .sidebar .search .results-panel.show {
            display: block !important;
            position: fixed;
            top: calc(var(--topbar-h) + 4px);
            right: 8px;
            width: min(420px, calc(100vw - 16px));
            max-height: calc(100vh - var(--topbar-h) - 20px);
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
            z-index: 90;
            padding: 10px 14px;
        }
        /* ドロップダウン内のマッチ項目 */
        body.topbar-search-active .sidebar .search .matching-post { padding: 6px 0; }
        body.topbar-search-active .sidebar .search .matching-post a { color: #333; }
        body.topbar-search-active .sidebar .search h2 { font-size: 0.95em !important; margin: 4px 0 !important; color: #333; display: block !important; }
        body.topbar-search-active .sidebar .search h2::before { content: none !important; }
        body.topbar-search-active .sidebar .search .search-keyword { background: #ffeb8f; padding: 0 2px; border-radius: 2px; font-style: normal; }

        /* サイドバーに不透明な背景を保証（PC/モバイル共通） */
        .sidebar { background: #fff; }

        /* ============ 本文スタイル ============ */
        .markdown-section {
            max-width: 900px;
            padding-top: 1.5em;
        }
        .markdown-section h1 { font-size: 2em; padding-bottom: 10px; border-bottom: 2px solid #eaecef; }
        /* 中項目(h2)の番号を黒四角＋白抜きで自動付与 */
        .markdown-section { counter-reset: sec-num; }
        .markdown-section h2 {
            counter-increment: sec-num;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .markdown-section h2::before {
            content: counter(sec-num);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.6em;
            height: 1.6em;
            padding: 0;
            background: #000;
            color: #fff;
            font-size: 0.75em;
            font-weight: bold;
            border-radius: 3px;
            flex-shrink: 0;
            aspect-ratio: 1 / 1;
        }
        /* .no-num を付けたh2は番号を付けない */
        .markdown-section h2.no-num { counter-increment: none; display: block; }
        .markdown-section h2.no-num::before { content: none; }
        .markdown-section h3 { font-size: 1.2em; }
        .markdown-section h4 { font-size: 1.05em; }
        @media (max-width: 768px) {
            .markdown-section h1 { font-size: 1.5em; }
            .markdown-section h2 { font-size: 1.2em; }
            .markdown-section h3 { font-size: 1.1em; }
            .markdown-section h4 { font-size: 1em; }
        }
        .markdown-section h1 a:hover,
        .markdown-section h2 a:hover,
        .markdown-section h3 a:hover,
        .markdown-section h4 a:hover {
            text-decoration: none;
            border-bottom: none;
        }
        .markdown-section img {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .markdown-section table { display: table; width: 100%; }
        .sidebar-nav > ul > li > p { font-weight: bold; color: #666; }
    </style>
</head>
<body>
    <div id="topbar">
        <button id="topbar-toggle" aria-label="メニューを開閉">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="4" y1="7" x2="20" y2="7"/>
                <line x1="4" y1="12" x2="20" y2="12"/>
                <line x1="4" y1="17" x2="20" y2="17"/>
            </svg>
        </button>
        <span id="topbar-title">FAMITORY<br>マニュアル</span>
        <div id="topbar-spacer"></div>
        <div id="topbar-search">
            <input type="search" id="topbar-search-input" placeholder="マニュアル内を検索" aria-label="検索">
        </div>
        <button id="topbar-search-btn" aria-label="検索を開閉">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.5" y2="16.5"/>
            </svg>
        </button>
    </div>
    <div id="app">読み込み中...</div>
    <script>
        window.$docsify = {
            name: 'FAMITORY マニュアル',
            repo: '',
            loadSidebar: true,
            subMaxLevel: 2,
            auto2top: true,
            homepage: 'README.md',
            search: {
                paths: 'auto',
                placeholder: 'マニュアル内を検索',
                noData: '該当する内容が見つかりませんでした',
                depth: 6,
                hideOtherSidebarContent: false
            },
            pagination: {
                previousText: '← 前の章',
                nextText: '次の章 →',
                crossChapter: true
            }
        }
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script>
        // サイドバー開閉（leftインラインスタイルで直接制御）
        const isMobile = () => window.matchMedia('(max-width: 768px)').matches;
        const sidebar = () => document.querySelector('.sidebar');
        let sbOpen = !isMobile(); // 既定: PC=開、モバイル=閉
        function applySidebar() {
            const sb = sidebar();
            if (!sb) return;
            sb.style.setProperty('left', sbOpen ? '0px' : '-320px', 'important');
            document.body.classList.toggle('sb-open', isMobile() && sbOpen);
            document.body.classList.toggle('sb-closed', !isMobile() && !sbOpen);
        }
        // 初期適用（Docsifyサイドバー描画後）
        const applyLoop = setInterval(() => {
            if (sidebar()) {
                applySidebar();
                clearInterval(applyLoop);
            }
        }, 50);
        document.getElementById('topbar-toggle').addEventListener('click', () => {
            sbOpen = !sbOpen;
            applySidebar();
        });
        // 画面サイズ変更時に既定状態へ戻す
        let wasMobile = isMobile();
        window.addEventListener('resize', () => {
            const nowMobile = isMobile();
            if (nowMobile !== wasMobile) {
                sbOpen = !nowMobile;
                applySidebar();
                wasMobile = nowMobile;
            }
        });
        // モバイルでオーバーレイ領域をタップすると閉じる
        document.addEventListener('click', (e) => {
            if (!isMobile() || !sbOpen) return;
            if (e.target.closest('.sidebar') || e.target.closest('#topbar')) return;
            sbOpen = false;
            applySidebar();
        });
        // タイトルクリックでトップへ
        document.getElementById('topbar-title').addEventListener('click', () => {
            location.hash = '#/';
        });
        // 検索アイコンで入力欄をトグル。入力はDocsify内蔵検索のinputへ中継
        const sBtn = document.getElementById('topbar-search-btn');
        const sWrap = document.getElementById('topbar-search');
        const sInput = document.getElementById('topbar-search-input');
        sBtn.addEventListener('click', () => {
            sWrap.classList.toggle('open');
            if (sWrap.classList.contains('open')) {
                setTimeout(() => sInput.focus(), 50);
            }
        });
        sInput.addEventListener('input', () => {
            const docsifySearch = document.querySelector('.sidebar .search input');
            if (!docsifySearch) return;
            docsifySearch.value = sInput.value;
            docsifySearch.dispatchEvent(new Event('input', { bubbles: true }));
            // 入力があれば結果ドロップダウンを表示（body classで制御）
            document.body.classList.toggle('topbar-search-active', !!sInput.value.trim());
        });
        // 検索結果のリンクをタップしたらドロップダウンを閉じて検索欄も閉じる
        document.addEventListener('click', (e) => {
            const link = e.target.closest('.sidebar .search .results-panel a');
            if (!link) return;
            document.body.classList.remove('topbar-search-active');
            sWrap.classList.remove('open');
            sInput.value = '';
            const docsifySearch = document.querySelector('.sidebar .search input');
            if (docsifySearch) {
                docsifySearch.value = '';
                docsifySearch.dispatchEvent(new Event('input', { bubbles: true }));
            }
        });
        // 検索欄・ドロップダウン・検索ボタン以外をクリックしたら閉じる
        document.addEventListener('click', (e) => {
            if (e.target.closest('#topbar-search') || e.target.closest('#topbar-search-btn')) return;
            if (e.target.closest('.sidebar .search .results-panel')) return;
            if (document.body.classList.contains('topbar-search-active')) {
                document.body.classList.remove('topbar-search-active');
            }
        });
    </script>
</body>
</html>
