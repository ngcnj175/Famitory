<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>FAMITORY マニュアル</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no">
    <meta name="description" content="FAMITORY（ファミトリー）のつかいかたマニュアル">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <style>
        :root {
            --theme-color: #3498db;
        }
        body, .sidebar, .markdown-section, .search input {
            font-family: 'BIZ UDPGothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* サイドバー: サイト名リンクのホバー下線のみ無効化 */
        .sidebar .app-name-link:hover,
        .sidebar .app-name a:hover {
            text-decoration: none !important;
            border-bottom: none !important;
        }
        /* ハンバーガーメニューはPCでは非表示（サイドバー常時表示のため不要） */
        @media (min-width: 769px) {
            .sidebar-toggle {
                display: none !important;
            }
        }
        /* スマホでは本文と重ならないよう背景とアイコン色を強化 */
        @media (max-width: 768px) {
            .sidebar-toggle {
                background-color: rgba(255, 255, 255, 0.95) !important;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
                border-radius: 4px;
                width: 44px !important;
                padding: 8px !important;
            }
        }
        .markdown-section {
            max-width: 900px;
        }
        /* 見出しサイズ（PC） */
        .markdown-section h1 { font-size: 2em; }
        .markdown-section h2 { font-size: 1.5em; }
        .markdown-section h3 { font-size: 1.2em; }
        .markdown-section h4 { font-size: 1.05em; }
        /* 見出しサイズ（スマホ: 768px以下） */
        @media (max-width: 768px) {
            .markdown-section h1 { font-size: 1.5em; }
            .markdown-section h2 { font-size: 1.2em; }
            .markdown-section h3 { font-size: 1.1em; }
            .markdown-section h4 { font-size: 1em; }
        }
        /* メインエリアのページタイトル（h1）に仕切り線 */
        .markdown-section h1 {
            padding-bottom: 14px;
            border-bottom: 2px solid #364149;
        }
        /* 見出し内アンカーのホバー下線を無効化 */
        .markdown-section h1 a:hover,
        .markdown-section h2 a:hover,
        .markdown-section h3 a:hover,
        .markdown-section h4 a:hover {
            text-decoration: none;
            border-bottom: none;
        }
        .markdown-section img {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .markdown-section table {
            display: table;
            width: 100%;
        }
        .sidebar-nav > ul > li > p {
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app">読み込み中...</div>
    <script>
        window.$docsify = {
            name: 'FAMITORY マニュアル',
            repo: '',
            loadSidebar: true,
            subMaxLevel: 2,
            auto2top: true,
            homepage: 'README.md',
            search: {
                paths: 'auto',
                placeholder: 'マニュアル内を検索',
                noData: '該当する内容が見つかりませんでした',
                depth: 6,
                hideOtherSidebarContent: false
            },
            pagination: {
                previousText: '← 前の章',
                nextText: '次の章 →',
                crossChapter: true
            }
        }
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
